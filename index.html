<style>
  /* Shared palette. Keep in step with the app's dark theme. */
  :root {
    --background: hsl(215 28% 7%);
    --foreground: hsl(213 33% 93%);
    --card: hsl(215 21% 11%);
    --primary: hsl(212 100% 67%);
    --primary-foreground: hsl(0 0% 100%);
    --muted-foreground: hsl(213 8% 58%);
    --border: hsl(215 13% 21%);
    --radius: 0.5rem;
    color-scheme: dark;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--background);
    color: var(--foreground);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid;
    grid-template-rows: 1fr auto;
    padding: 2rem 1.5rem;
  }
  main {
    place-self: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 30rem;
    width: 100%;
  }
  .mark { width: clamp(4rem, 12vw, 5.75rem); height: auto; fill: var(--foreground); }
  h1 {
    margin-top: 2rem;
    font-size: clamp(1.75rem, 5vw, 2.5rem);
    font-weight: 600;
    letter-spacing: -0.025em;
  }
  .tag { margin-top: 0.75rem; font-size: 1.0625rem; color: var(--muted-foreground); }
  .divider { width: 100%; height: 1px; background: var(--border); margin: 2.5rem 0 1.75rem; }

  .gate { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 0.875rem; }
  button {
    font: inherit;
    font-size: 0.9375rem;
    font-weight: 500;
    color: var(--primary-foreground);
    background: var(--primary);
    border: none;
    border-radius: var(--radius);
    padding: 0.625rem 1.25rem;
    cursor: pointer;
    transition: opacity .15s ease;
    display: inline-flex; align-items: center; gap: 0.5rem;
  }
  button:hover { opacity: .9; }
  button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .note {
    font-size: 0.8125rem;
    color: var(--muted-foreground);
    line-height: 1.5;
    max-width: 24rem;
    min-height: 2.25rem;
  }
  .note[hidden] { display: none; }
  footer { place-self: center; font-size: 0.8125rem; color: var(--muted-foreground); padding-top: 2.5rem; }
</style>

  <p class="tag">Coming soon.</p>

  <div class="divider"></div>

  <div class="gate">

    <p class="note" id="note" role="status">Access is invite&#8209;only.</p>
  </div>

<footer>&copy; 2026 Radiator</footer>

<script>
  // Says nothing about how sign-in works, what it runs on, or whether any
  // particular visitor has access. A public page has no way to know the last
  // one, and the first two are nobody's business.
  document.getElementById('signin').addEventListener('click', function () {
    document.getElementById('note').textContent = 'Not open yet.';
  });
